name: Check Telegram Hello

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-hello:
    name: Did the bot receive hello?
    runs-on: ubuntu-latest
    steps:
      - name: Look for the private hello message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 2 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=20")"
          python3 - <<'PY' "$response"
          import json
          import sys

          data = json.loads(sys.argv[1])
          found = False
          for update in data.get("result", []):
              message = update.get("message", {})
              if message.get("text") == "hello":
                  found = True
                  break
          if not found:
              raise SystemExit("The bot did not find the word hello yet.")
          print("PASS: The bot received your private hello message.")
          PY
